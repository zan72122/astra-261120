<!doctype html>
<html lang="ja">
  <head>
<meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preload" as="image" href="counter-tall.jpg" media="(max-aspect-ratio:4/5)" />
    <link rel="preload" as="image" href="counter-wide.jpg" media="(min-aspect-ratio:4/5)" />
    <meta name="theme-color" content="#f7ead2" />
    <title>ひろがるくれーぷ</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body,
      main {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #f5e8cd;
        touch-action: none;
        user-select: none;
      }
      main {
        position: relative;
        isolation: isolate;
        background: #b8d9d7 url("counter-wide.jpg") center/cover no-repeat;
      }
      #world {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #world:active {
        cursor: grabbing;
      }
      .trim {
        pointer-events: none;
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 0 1px #874c2920;
      }
      .canopy {
        position: absolute;
        pointer-events: none;
        top: 0;
        left: -1%;
        width: 102%;
        height: clamp(28px, 5vh, 50px);
        display: flex;
        filter: drop-shadow(0 3px 2px #4b302a40);
        transform-origin: top;
        transition: transform 1s;
      }
      .canopy i {
        flex: 1;
        background:
          linear-gradient(90deg, #ffffff09, #fff1 65%, #874f3814),
          linear-gradient(#d97759 0%, #e78968 34%, #c97053 39%, #d87c5e 41%, #e69578 94%, #bd674e 100%);
        border-radius: 0 0 50% 50% / 0 0 29% 29%;
        box-shadow: inset 0 -2px #7d453b20;
      }
      .canopy i:nth-child(even) {
        background:
          linear-gradient(90deg, #fff1, #fff2 75%, #ad856c19),
          linear-gradient(#f7e7cb, #ffefd5 34%, #d9c7ad 39%, #f5e4cb 41%, #ffefd9 94%, #d0baa0);
      }
      .close .canopy {
        transform: translateY(-125%);
      }
      .control {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: max(19px, env(safe-area-inset-right));
        border: 2px solid #fff1d4;
        border-radius: 50%;
        width: 47px;
        height: 47px;
        display: grid;
        place-items: center;
        background: #fffae9;
        color: #496453;
        box-shadow:
          0 3px 0 #806e4b40,
          0 3px 12px #40382e20;
        cursor: pointer;
        padding: 9px;
      }
      .control svg {
        width: 100%;
        height: 100%;
      }
      .control:active {
        transform: scale(0.95);
      }
      .muted .wave,
      .slash {
        display: none;
      }
      .muted .slash {
        display: block;
      }
      @media (max-aspect-ratio: 4/5) {
        main {
          background-image: url("counter-tall.jpg");
        }
        .canopy i:nth-child(n + 13) {
          display: none;
        }
        .control {
          width: 42px;
          height: 42px;
          right: 13px;
          top: max(11px, env(safe-area-inset-top));
        }
      }
      .sign {
        position: absolute;
        top: clamp(22px, 3.3vh, 37px);
        left: clamp(18px, 2.6vw, 52px);
        width: clamp(77px, 8.8vw, 126px);
        height: auto;
        pointer-events: none;
        filter: drop-shadow(1px 4px 3px #4e372f42);
        transform: rotate(-6deg);
        transform-origin: 50% 0;
        transition:
          opacity 0.55s,
          transform 0.8s;
      }
      .sign:before,
      .sign:after {
        content: "";
        position: absolute;
        left: 32%;
        top: -32%;
        height: 44%;
        width: 2px;
        background: #a27c50;
        box-shadow: 1px 0 #e4c099;
      }
      .sign:after {
        left: 69%;
      }
      .sign canvas {
        width: 100%;
        height: auto;
        display: block;
      }
      .close .sign {
        transform: translateY(-150%) rotate(-8deg);
        opacity: 0;
      }
      .canopy {
        height: clamp(30px, 6.2vh, 60px);
      }
      @media (max-aspect-ratio: 4/5) {
        .sign {
          width: 70px;
          left: 10px;
          top: 26px;
        }
      }
      html,
      body {
        overscroll-behavior: none;
      }
      main {
        height: 100dvh;
      }
      #world {
        opacity: 0;
        transition: opacity 0.18s;
      }
      .ready #world {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <main id="shop" aria-label="クレープ屋さん">
      <canvas id="world" aria-label="指で道具や食材を動かしてクレープを作る"></canvas>
      <div class="trim"></div>
      <div class="sign" aria-hidden="true"><canvas id="emblem"></canvas></div>
      <div class="canopy" aria-hidden="true"></div>
      <button class="control" id="sound" aria-label="音を消す" aria-pressed="false">
        <svg
          viewBox="0 0 30 30"
          fill="none"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 12h5l6-5v16l-6-5H4z" fill="currentColor" stroke-width="1" />
          <g class="wave"><path d="M19 10q5 5 0 10M23 7q8 8 0 16" /></g>
          <path class="slash" d="m19 11 7 8m0-8-7 8" />
        </svg>
      </button>
    </main>
    <script>
      document.querySelector(".canopy").innerHTML = "<i></i>".repeat(24);
    </script>
    <script src="emblem.js"></script>
    <script defer src="vendor/three.min.js"></script>
    <script defer src="textures.js"></script>
    <script>
      // Let the local rendering of this exact view paint before building the 3D scene.
      addEventListener(
        "DOMContentLoaded",
        async () => {
          const firstView = new Image();
          firstView.src = matchMedia("(max-aspect-ratio:4/5)").matches
            ? "counter-tall.jpg"
            : "counter-wide.jpg";
          try {
            await firstView.decode();
          } catch {}
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              for (const file of [
                "studio.js",
                "people.js",
                "square.js",
                "kitchen.js",
                "crepe.js",
                "game.js"
              ]) {
                const script = document.createElement("script");
                script.async = false;
                script.src = file;
                document.body.appendChild(script);
              }
            })
          );
        },
        { once: true }
      );
    </script>
  </body>
</html>
