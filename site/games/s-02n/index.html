<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8d9bf">
<title>ぽこぽこあがらさー</title>
<style>
*{box-sizing:border-box}
html,body,main{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#dfceb1;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
main{position:fixed;inset:0;background:linear-gradient(162deg,#d6e6de,#f0dfbf 52%,#b9936a 70%,#cfae81)}
canvas#room{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:grab}
canvas#room:active{cursor:grabbing}
picture{position:absolute;inset:0;display:block;pointer-events:none;opacity:1;transition:opacity .28s ease-out}
picture img{display:block;width:100%;height:100%;object-fit:cover}
picture.ready{opacity:0}
button{position:absolute;right:max(17px,env(safe-area-inset-right));top:max(17px,env(safe-area-inset-top));width:41px;height:41px;border-radius:50%;background:rgba(250,246,233,.92);border:1px solid rgba(113,96,72,.26);color:#4c5146;box-shadow:0 2px 8px #352b1c17;display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96)}button:focus-visible{outline:2px solid #294d59;outline-offset:3px}
button canvas{width:21px;height:21px;pointer-events:none}
@media(min-width:800px){button{right:24px;top:22px}}
</style>
<script defer src="vendor/three.min.js"></script>
<script defer src="model.js"></script>
<script defer src="dough.js"></script>
<script defer src="craft.js"></script>
<script defer src="house.js"></script>
<script defer src="family.js"></script>
<script defer src="kitchen.js"></script>
<script defer src="audio.js"></script>
<script defer src="main.js"></script>
</head>
<body>
<main aria-label="沖縄の台所">
<canvas id="room" aria-label="指で黒糖生地を注いで、せいろで蒸す台所"></canvas>
<picture aria-hidden="true"><source media="(max-aspect-ratio: 4/5)" srcset="opening-tall.webp"><img src="opening-wide.webp" alt="" fetchpriority="high"></picture>
<button type="button" aria-label="音を消す" aria-pressed="false"><canvas width="63" height="63" aria-hidden="true"></canvas></button>
</main>
</body>
</html>
