<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ac8f68"><title>ひんやり わらびもち</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,main{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#b4956f;color:#5f5441;touch-action:none;user-select:none;-webkit-user-select:none}main{position:relative;isolation:isolate}canvas{display:block;width:100%;height:100%;touch-action:none}
#sound,.steps{background:linear-gradient(150deg,rgba(255,249,230,.97),rgba(232,219,190,.95));border:1px solid #fff4d9;box-shadow:0 3px 10px #39230f30,0 1px 2px #523b2733,inset 0 -2px 2px #a28a6940;z-index:2}
#sound{position:absolute;right:max(22px,env(safe-area-inset-right));top:max(20px,env(safe-area-inset-top));border-radius:50%;width:44px;height:44px;display:grid;place-items:center;color:#635841;cursor:pointer}#sound svg{width:22px;height:22px}#sound:active{transform:scale(.94)}#muted{display:none}#sound[aria-pressed=true] #waves{display:none}#sound[aria-pressed=true] #muted{display:block}
.steps{pointer-events:none;position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:6px 11px;border-radius:26px}
.steps span{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:#93856c;transition:color .4s,background .4s}.steps svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.55;fill:none;stroke-linecap:round;stroke-linejoin:round}.steps i{width:3px;height:3px;background:#ab9676;border-radius:50%}.steps span.on{color:#fcf2d8;background:#77664b;box-shadow:inset 0 1px 3px #47362242}
#hint{position:absolute;left:0;top:0;width:48px;height:58px;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 3px #3428104d);transform-origin:9px 4px;z-index:1}
@media(max-width:500px){#sound{right:15px;top:max(16px,env(safe-area-inset-top));width:40px;height:40px}.steps{gap:6px;bottom:max(15px,env(safe-area-inset-bottom));padding:5px 10px}.steps span{width:29px;height:29px}}
</style>
</head>
<body><main><canvas id="scene" aria-label="わらびもちづくり"></canvas>
<button id="sound" type="button" aria-label="音の切り替え" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9h4L13 4.5v15L7.5 15h-4z"/><g id="waves"><path d="M16 8.3a5 5 0 0 1 0 7.4M18.8 5.4a9 9 0 0 1 0 13.2"/></g><path id="muted" d="m16.5 9.5 5 5m0-5-5 5"/></svg></button>
<div class="steps" aria-hidden="true">
<span class="on"><svg viewBox="0 0 24 24"><path d="m15.1 10 5-6.2c1.1-1.5-.7-3-2-1.7l-5.8 5.6-1.7.3c-1.1.3-2.7 2.2-3.8 3.6l-4.2 5.2c-.7 1.1 3.5 5 4.8 4.1l5-5.6c2.3-2.3 3.2-3.5 2.7-5.3Z"/><path d="m6.1 16.7 3.3-3.7"/></svg></span><i></i>
<span><svg viewBox="0 0 24 24"><path d="M12 2.2c-1 3.7-6.3 8.4-6.3 12.4a6.3 6.3 0 0 0 12.6 0C18.3 10.4 13 5.4 12 2.2Z"/><path d="M8.8 14.1c-.2 1.9.8 3.2 2.4 3.8"/></svg></span><i></i>
<span><svg viewBox="0 0 24 24"><ellipse cx="9" cy="15.2" rx="7" ry="5.6" transform="rotate(-30 9 15.2)"/><path d="m14.4 10.8 6.2-7.7c.9-1.1 2.4 0 1.5 1.1l-6.3 7.8M4.7 14.4l4.2 5.3m-1.4-7.2 4.5 5.7m-7.4-1 7.6-5.6m-5.4 8 7.3-5.8"/></svg></span><i></i>
<span><svg viewBox="0 0 24 24"><path d="M2.3 12.6c.6 5.2 4.2 7.1 9.7 7.1s9-2.4 9.7-7.1Zm6.3 7.1v1.6h6.9v-1.6M4.3 12.2c-1-5.5 6.7-7.2 8.5-2.4m-1.4 2.4c.3-5.3 8.2-5.7 8.5.1"/></svg></span>
</div>
<svg id="hint" viewBox="0 0 51 62" aria-hidden="true"><path d="M11 26 5 8.5C3.4 3.5 9.7 1.2 11.8 6l8.3 18-1.6-6c-1-4.2 4.8-6 7-1.8l2.5 5.2-.8-4.3c-.6-3.8 4.4-4.8 6.4-.9l2.4 5.3-.5-2.6c-.5-3.6 4-4.6 6-1.2 2.6 4.8 4.9 10.2 5.1 15.3.2 5.5-2.2 8.7-2.4 12.4l1.5 5.4-17.4 6.4-3-5.6c-3.9-3.8-7.8-5.6-11.6-9.5L4.2 32.3c-3.6-4.2.3-8.6 4.3-5.5l7.1 5.4Z" fill="#fff2d9" stroke="#936e4c" stroke-width="1.65" stroke-linejoin="round"/></svg>
</main>
<script src="vendor/three.min.js"></script><script src="simulation.js"></script><script src="studio.js"></script><script src="models.js"></script><script src="game.js"></script>
</body></html>
