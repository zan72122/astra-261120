<!doctype html>
<html lang="ja">
  <head>
<meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#183d34" />
    <title>くるんと アイス</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body,
      main {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
      }
      body {
        background: #233d34;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      main {
        position: relative;
        isolation: isolate;
      }
      main:after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          var(--grain, none),
          radial-gradient(ellipse at 49% 44%, transparent 43%, rgba(28, 20, 14, 0.16) 100%);
        background-size:
          80px 80px,
          cover;
      }
      button {
        position: absolute;
        z-index: 2;
        top: max(17px, env(safe-area-inset-top));
        right: max(19px, env(safe-area-inset-right));
        width: 42px;
        height: 42px;
        padding: 10px;
        display: grid;
        place-items: center;
        border: 1px solid #dbd1a773;
        border-radius: 50%;
        background: rgba(24, 49, 40, 0.79);
        color: #f6e9c9;
        box-shadow: 0 3px 10px #14231e30;
        cursor: pointer;
      }
      button svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      button .slash,
      button.muted .waves {
        display: none;
      }
      button.muted .slash {
        display: block;
      }
      button:focus-visible {
        outline: 2px solid #ffe1aa;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas aria-label="バナナのロールアイス屋台"></canvas
      ><button aria-label="音を消す" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9h4l5-4v14l-5-4H3z" />
          <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" /></g>
          <path class="slash" d="m16 9 5 6m0-6-5 6" />
        </svg>
      </button>
    </main>
    <script src="vendor/three.min.js"></script>
    <script src="sim.js"></script>
    <script src="models.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
  </body>
</html>
